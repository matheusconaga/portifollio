<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Jockey+One&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      (() => {
        const hostname =
          window.location.hostname;

        const isServer =
          hostname ===
          "server.matheusconaga.dev";

        const isAnalytics =
          hostname ===
          "analytics.matheusconaga.dev";

        /*
         * Manifest
         */
        const manifest =
          document.createElement(
            "link",
          );

        manifest.rel = "manifest";

        if (isServer) {
          manifest.href =
            "/manifest-server.webmanifest";
        } else if (isAnalytics) {
          manifest.href =
            "/manifest-analytics.webmanifest";
        } else {
          manifest.href =
            "/manifest-portfolio.webmanifest";
        }

        document.head.appendChild(
          manifest,
        );

        /*
         * Theme color
         */
        const themeColor =
          document.createElement(
            "meta",
          );

        themeColor.name =
          "theme-color";

        if (isServer) {
          themeColor.content =
            "#050816";
        } else {
          themeColor.content =
            "#080322";
        }

        document.head.appendChild(
          themeColor,
        );

        /*
         * Favicon
         */
        const favicon =
          document.createElement(
            "link",
          );

        favicon.rel = "icon";

        if (isServer) {
          favicon.type =
            "image/png";

          favicon.href =
            "/server-pwa-192x192.png";
        } else if (isAnalytics) {
          favicon.type =
            "image/png";

          favicon.href =
            "/analytics-pwa-192x192.png";
        } else {
          favicon.type =
            "image/svg+xml";

          favicon.href =
            "/logo_matheus.svg";
        }

        document.head.appendChild(
          favicon,
        );

        /*
         * Apple Touch Icon
         */
        const appleIcon =
          document.createElement(
            "link",
          );

        appleIcon.rel =
          "apple-touch-icon";

        if (isServer) {
          appleIcon.href =
            "/server-pwa-192x192.png";
        } else if (isAnalytics) {
          appleIcon.href =
            "/analytics-pwa-192x192.png";
        } else {
          appleIcon.href =
            "/apple-touch-icon.png";
        }

        document.head.appendChild(
          appleIcon,
        );

        /*
         * Title + description
         */
        const description =
          document.createElement(
            "meta",
          );

        description.name =
          "description";

        if (isServer) {
          document.title =
            "Mini Server | Matheus Lula";

          description.content =
            "Painel privado de monitoramento do Mini Server.";
        } else if (isAnalytics) {
          document.title =
            "Analytics | Matheus Lula";

          description.content =
            "Dashboard privado de analytics do portfólio.";
        } else {
          document.title =
            "Matheus Lula | Fullstack Developer";

          description.content =
            "Matheus Lula — Desenvolvedor Fullstack. Projetos, produtos, startups e desenvolvimento de aplicações web e mobile.";
        }

        document.head.appendChild(
          description,
        );

        /*
         * Portfolio-only preloads
         */
        if (
          !isServer &&
          !isAnalytics
        ) {
          const preloadImages = [
            "/euxl.webp",
            "/logo_matheus.webp",
            "/eu_persona.webp",
            "/chat-dev.webp",
          ];

          preloadImages.forEach(
            (href) => {
              const preload =
                document.createElement(
                  "link",
                );

              preload.rel =
                "preload";

              preload.as =
                "image";

              preload.href =
                href;

              document.head.appendChild(
                preload,
              );
            },
          );
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
